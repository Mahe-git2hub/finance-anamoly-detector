[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-streaming"
version = "0.1.0"
description = "Real-time Indian market anomaly detection system"
readme = "README.md"
authors = [{name = "AI", email = "ai@example.com"}]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.3",           # CVE-2024-9880
    "numpy>=1.25",
    "httpx>=0.27",
    "scikit-learn>=1.5.0",     # CVE-2024-5206
    "plotly>=5.20",
    "dash>=2.17",
    "fastapi>=0.136.1",        # CVE-2026-48710, CVE-2025-62727
    "starlette>=1.0.1",        # CVE-2026-48710
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
