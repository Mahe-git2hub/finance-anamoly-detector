[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-streaming"
version = "0.1.0"
description = "Real-time Indian market anomaly detection system"
readme = "README.md"
authors = [{name = "AI", email = "ai@example.com"}]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "httpx>=0.28.0",
    "scikit-learn>=1.5.0",
    "plotly>=5.24.0",
    "dash>=2.18.0",
    "fastapi>=0.115.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
